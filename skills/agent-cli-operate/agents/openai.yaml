# Agent interface definition consumed by the Claude Code skills runtime.
# - display_name: human-readable label shown in the agent UI
# - short_description: one-line summary for skill selection menus
# - default_prompt: template with $skill-name variable references
#   that the runtime resolves to the corresponding SKILL.md content.
interface:
  display_name: "Agent CLI Operate"
  short_description: "Run upgrade or reboot safely"
  default_prompt: "Use $agent-cli-operate for approved firmware upgrades or reboot actions on a device."
