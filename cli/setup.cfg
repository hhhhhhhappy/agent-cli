[metadata]
name = agent-cli
version = 0.1.0
description = Windows-oriented CLI for remote agent_cli access over SSH.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
python_requires = >=3.6
packages = cli
package_dir =
    cli = .

[options.entry_points]
console_scripts =
    agent-cli = cli.cli:main
